[project]
name = "sigil-ai"
version = "0.1.0"
description = "One API to make AI output compliant with labeling laws in the EU, California, India and Korea."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["fastapi", "uvicorn", "pillow", "numpy", "PyWavelets", "opencv-python-headless",
                "c2pa-python>=0.38", "cryptography", "python-multipart"]
[project.optional-dependencies]
dev = ["pytest", "httpx"]
[project.scripts]
sigil = "sigil.__main__:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.package-data]
sigil = ["static/*.html"]
